<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Orange Sweeping Arc & Cupping Hand -->
  <path d="M 125,355 C 60,300 40,210 65,130 C 95,50 185,5 270,10 C 330,15 390,40 435,75 C 380,50 315,40 250,55 C 170,75 105,135 90,215 C 80,270 100,320 135,358 L 125,355 Z" fill="#F26522" />
  
  <path d="M 135,358 C 75,370 45,410 75,445 C 115,490 190,505 255,495 C 330,485 400,440 450,380 C 455,375 425,385 410,385 C 370,390 330,385 295,375 C 240,360 215,365 240,355 C 265,345 300,345 315,335 C 325,325 315,315 285,315 C 230,315 190,325 150,345 C 130,355 125,358 135,358 Z" fill="#F26522" />

  <!-- Royal Blue House Silhouette -->
  <!-- Roof -->
  <polygon points="250,80 120,215 145,215 250,110 355,215 380,215" fill="#242D8A" />
  
  <!-- House Body -->
  <polygon points="170,200 330,200 330,350 170,350" fill="#242D8A" />

  <!-- 4 Monogram Tiles: S K H S -->
  <g fill="#FFFFFF">
    <!-- Tile Backgrounds inside House -->
    <rect x="210" y="210" width="36" height="36" rx="4" fill="#FFFFFF" />
    <rect x="254" y="210" width="36" height="36" rx="4" fill="#FFFFFF" />
    <rect x="210" y="254" width="36" height="36" rx="4" fill="#FFFFFF" />
    <rect x="254" y="254" width="36" height="36" rx="4" fill="#FFFFFF" />
    
    <!-- Lettering in Blue -->
    <text x="228" y="237" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#242D8A" text-anchor="middle" dominant-baseline="central">S</text>
    <text x="272" y="237" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#242D8A" text-anchor="middle" dominant-baseline="central">K</text>
    <text x="228" y="281" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#242D8A" text-anchor="middle" dominant-baseline="central">H</text>
    <text x="272" y="281" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#242D8A" text-anchor="middle" dominant-baseline="central">S</text>
  </g>
